# Publishes the DocC site to GitHub Pages.
name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: xcode-27  # Xcode 27 (Swift 6.4) is in public preview; macos-26 images stop at 26.6.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs
      - id: deployment
        uses: actions/deploy-pages@v4
