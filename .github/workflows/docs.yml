# Publishes the DocC site to GitHub Pages. Pages sites are public even for private repositories,
# so this runs only on demand until the project is open sourced; then add `push: branches: [main]`.
name: docs
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs
      - id: deployment
        uses: actions/deploy-pages@v4
